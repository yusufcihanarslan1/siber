<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER PORTAL v4.0 - Profesyonel Eğitim Platformu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root {
            --accent: #0ea5e9;
            --accent-glow: rgba(14, 165, 233, 0.3);
            --bg-deep: #020617;
            --surface: #0f172a;
            --border: #1e293b;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-deep);
            color: #f1f5f9;
            overflow-x: hidden;
        }

        .mono { font-family: 'Fira Code', monospace; }

        /* Cyber UI Elements */
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
        }

        .cyber-card {
            background: var(--surface);
            border: 1px solid var(--border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .cyber-card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 0; height: 2px;
            background: var(--accent);
            transition: width 0.3s ease;
        }

        .cyber-card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px -10px var(--accent-glow);
        }

        .cyber-card:hover::after { width: 100%; }

        /* Sidebar & Layout */
        .portal-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            height: 100vh;
        }

        .sidebar {
            border-right: 1px solid var(--border);
            background: #020617;
        }

        /* Reading Experience */
        .prose-cyber h1 { @apply text-4xl font-extrabold text-white mb-6 tracking-tight; }
        .prose-cyber h2 { @apply text-xl font-bold text-sky-400 mt-10 mb-4 flex items-center border-l-4 border-sky-500 pl-4; }
        .prose-cyber p { @apply text-slate-300 leading-relaxed mb-6 text-lg; }
        
        .interactive-terminal {
            background: #000;
            border-radius: 8px;
            padding: 20px;
            font-family: 'Fira Code', monospace;
            border: 1px solid #334155;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .terminal-header {
            @apply flex items-center gap-2 mb-4 border-b border-slate-800 pb-2 text-[10px] text-slate-500 font-bold uppercase tracking-widest;
        }

        /* Category Badges */
        .badge-net { @apply bg-sky-500/10 text-sky-400 border border-sky-500/20; }
        .badge-off { @apply bg-red-500/10 text-red-400 border border-red-500/20; }
        .badge-def { @apply bg-emerald-500/10 text-emerald-400 border border-emerald-500/20; }

        .progress-circle {
            rotate: -90deg;
            transition: stroke-dashoffset 0.5s ease;
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .modal-active { display: flex !important; animation: fadeIn 0.3s ease-out; }
    </style>
</head>
<body class="antialiased">

    <div class="portal-grid">
        <!-- Sol Menü (Sidebar) -->
        <aside class="sidebar flex flex-col h-full overflow-hidden">
            <div class="p-6 border-b border-slate-800">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-10 h-10 bg-sky-500 rounded-xl flex items-center justify-center shadow-lg shadow-sky-500/20">
                        <i class="fas fa-shield-halved text-slate-950 text-xl"></i>
                    </div>
                    <div>
                        <h1 class="font-black text-lg tracking-tighter uppercase leading-none">CYBER<span class="text-sky-500">PORTAL</span></h1>
                        <span class="text-[9px] text-slate-500 font-bold tracking-widest">v4.0 ACADEMY</span>
                    </div>
                </div>

                <div class="bg-slate-900/50 rounded-xl p-4 border border-slate-800">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[10px] font-bold text-slate-400 uppercase">Seviye 1: Çaylak</span>
                        <span id="perc-val" class="text-[10px] mono text-sky-400">0%</span>
                    </div>
                    <div class="w-full h-1.5 bg-slate-950 rounded-full overflow-hidden">
                        <div id="main-progress" class="h-full bg-sky-500 w-0 transition-all duration-1000"></div>
                    </div>
                </div>
            </div>

            <nav class="flex-1 overflow-y-auto p-4 space-y-8 mt-4">
                <div>
                    <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] px-4 mb-4">Eğitim Yolları</h3>
                    <div class="space-y-1">
                        <button onclick="filter('all')" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-semibold rounded-lg hover:bg-slate-900 transition text-slate-400 hover:text-white group">
                            <i class="fas fa-layer-group text-slate-600 group-hover:text-sky-400"></i>
                            Tüm Modüller
                        </button>
                        <button onclick="filter('cat-net')" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-semibold rounded-lg hover:bg-slate-900 transition text-slate-400 hover:text-white group">
                            <i class="fas fa-network-wired text-slate-600 group-hover:text-sky-400"></i>
                            Ağ Güvenliği
                        </button>
                        <button onclick="filter('cat-off')" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-semibold rounded-lg hover:bg-slate-900 transition text-slate-400 hover:text-white group">
                            <i class="fas fa-skull text-slate-600 group-hover:text-red-400"></i>
                            Ofansif Sızma
                        </button>
                        <button onclick="filter('cat-def')" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-semibold rounded-lg hover:bg-slate-900 transition text-slate-400 hover:text-white group">
                            <i class="fas fa-user-shield text-slate-600 group-hover:text-emerald-400"></i>
                            Defansif Analiz
                        </button>
                    </div>
                </div>

                <div class="px-4 pt-8 border-t border-slate-900">
                    <div class="flex items-center gap-2 text-sky-500 mb-2">
                        <i class="fas fa-crown text-xs"></i>
                        <span class="text-[10px] font-black uppercase">Sıralama</span>
                    </div>
                    <p class="text-xs text-slate-500">Dünya genelinde 12,450 öğrenci arasında <strong>#2,401</strong> sıradasın.</p>
                </div>
            </nav>
        </aside>

        <!-- Ana İçerik Alanı -->
        <main class="h-full overflow-y-auto bg-[#020617] relative">
            
            <!-- Üst Bar -->
            <header class="sticky top-0 z-30 glass-panel px-8 py-4 flex justify-between items-center border-b border-slate-800">
                <div class="flex items-center gap-6">
                    <div class="relative">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                        <input type="text" id="searchInput" onkeyup="searchTopics()" placeholder="Ders veya komut ara..." class="bg-slate-900 border border-slate-800 rounded-lg pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-sky-500 w-64 transition-all">
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex -space-x-2">
                        <div class="w-8 h-8 rounded-full bg-slate-800 border-2 border-slate-900 flex items-center justify-center text-[10px] font-bold">JD</div>
                    </div>
                    <button class="bg-sky-500 text-slate-950 px-4 py-2 rounded-lg text-xs font-black uppercase tracking-tighter hover:bg-sky-400 transition">
                        PRO Sürüm
                    </button>
                </div>
            </header>

            <!-- Dinamik İçerik -->
            <div class="p-8 max-w-7xl mx-auto">
                
                <div id="stats-banner" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-10 animate-fade">
                    <div class="bg-slate-900/40 p-4 rounded-xl border border-slate-800">
                        <span class="text-[10px] text-slate-500 font-bold uppercase">Toplam Eğitim</span>
                        <div class="text-2xl font-black mt-1">210</div>
                    </div>
                    <div class="bg-slate-900/40 p-4 rounded-xl border border-slate-800">
                        <span class="text-[10px] text-slate-500 font-bold uppercase">Tamamlanan</span>
                        <div id="count-done" class="text-2xl font-black mt-1 text-sky-400">0</div>
                    </div>
                    <div class="bg-slate-900/40 p-4 rounded-xl border border-slate-800">
                        <span class="text-[10px] text-slate-500 font-bold uppercase">Kazanılan XP</span>
                        <div id="xp-val" class="text-2xl font-black mt-1 text-purple-400">0</div>
                    </div>
                    <div class="bg-slate-900/40 p-4 rounded-xl border border-slate-800">
                        <span class="text-[10px] text-slate-500 font-bold uppercase">Kurs Başarısı</span>
                        <div class="text-2xl font-black mt-1 text-emerald-400">A+</div>
                    </div>
                </div>

                <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Eğitim Kartları -->
                </div>
            </div>
        </main>
    </div>

    <!-- Eğitim Modalı (Okuyucu) -->
    <div id="reader-modal" class="fixed inset-0 z-[100] hidden bg-slate-950/95 backdrop-blur-xl flex-col items-center overflow-y-auto">
        <div class="max-w-4xl w-full min-h-screen bg-slate-950 border-x border-slate-900">
            <div class="sticky top-0 bg-slate-950/90 border-b border-slate-900 p-6 flex justify-between items-center backdrop-blur-md z-50">
                <div class="flex items-center gap-4">
                    <button onclick="closeReader()" class="w-10 h-10 rounded-full hover:bg-slate-900 flex items-center justify-center transition">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div>
                        <span id="modal-vol" class="text-[10px] mono text-sky-500 font-bold">DERS #001</span>
                        <h2 id="modal-title" class="text-lg font-bold leading-none">Eğitim Başlığı</h2>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="markDone()" id="done-btn" class="px-6 py-2 bg-sky-500 text-slate-950 rounded-lg text-xs font-black uppercase hover:bg-sky-400 transition">
                        Tamamlandı Olarak İşaretle
                    </button>
                </div>
            </div>

            <div id="modal-content" class="p-10 md:p-16 prose-cyber">
                <!-- Makale buraya gelecek -->
            </div>

            <!-- İnteraktif Bölüm Örneği -->
            <div class="px-10 pb-20">
                <div class="terminal-header">Uygulama Alanı: Komut Simülatörü</div>
                <div class="interactive-terminal">
                    <div class="flex gap-2 mb-2">
                        <span class="text-emerald-500">root@cyberportal:~#</span>
                        <input type="text" id="terminal-input" onkeydown="handleTerminal(event)" class="bg-transparent outline-none text-emerald-500 w-full" placeholder="Komut yaz (örn: nmap -sV target)">
                    </div>
                    <div id="terminal-output" class="text-xs text-slate-400 whitespace-pre-wrap"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const topics = [
            {
                id: 1, cat: 'cat-net', title: 'Ağ Analizine Giriş: Wireshark & TCP', icon: 'fa-network-wired', xp: 150,
                short: 'Paket yakalama, protokol analizi ve ağ katmanı güvenliğinin temelleri.',
                content: `<h1>Wireshark ile Ağ Analizi</h1><p>Siber güvenliğin en temel yeteneği, ağ üzerinden geçen trafiği anlamlandırmaktır. Bir hacker, kabloların içindeki veriyi görmeden başarılı olamaz.</p><h2>TCP El Sıkışması</h2><p>TCP (Transmission Control Protocol), verinin güvenli iletimini sağlamak için üç aşamalı bir el sıkışma (handshake) kullanır:</p><ul><li><strong>SYN:</strong> İstemci bağlantı talebi gönderir.</li><li><strong>SYN-ACK:</strong> Sunucu talebi aldığını ve hazır olduğunu bildirir.</li><li><strong>ACK:</strong> İstemci bağlantıyı başlatır.</li></ul><p>Bu süreçteki anomaliler (örneğin sadece SYN gönderip ACK göndermemek), <strong>SYN Flood</strong> saldırısının temelini oluşturur.</p>`
            },
            {
                id: 45, cat: 'cat-off', title: 'SQL Injection: Veritabanı Sızma', icon: 'fa-database', xp: 300,
                short: 'Web uygulamalarında veritabanı manipülasyonu ve ileri seviye injection teknikleri.',
                content: `<h1>SQL Injection Operasyonu</h1><p>Web uygulama güvenliğinin en tehlikeli zafiyetlerinden biri olan SQL Injection, saldırganın uygulama üzerinden veritabanına doğrudan komut göndermesine olanak tanır.</p><h2>Saldırı Mantığı</h2><p>Uygulama, kullanıcıdan aldığı veriyi temizlemeden (sanitization) SQL sorgusuna dahil ederse zafiyet oluşur.</p><h2>Tipik Senaryo</h2><div class="interactive-terminal mb-4"><div class="text-[10px] text-slate-500 mb-2">ZAFİYETLİ SORGÜ</div><div class="text-red-400">"SELECT * FROM users WHERE id = " + user_input;</div></div><p>Eğer kullanıcı giriş olarak <strong>' OR 1=1 --</strong> verirse, sistem tüm kullanıcıları döndürecektir.</p>`
            }
            // Diğer 208 konu otomatik üretiliyor...
        ];

        // 210'a tamamlama mantığı
        for(let i=1; i<=210; i++) {
            if(!topics.find(t => t.id === i)) {
                let cat = i < 70 ? 'cat-net' : (i < 140 ? 'cat-off' : 'cat-def');
                topics.push({
                    id: i, cat: cat, title: `Modül #${i}: Teknik Doküman`, icon: 'fa-microchip', xp: 200,
                    short: 'Siber güvenlik müfredatının bir parçası olan ileri seviye teknik içerik.',
                    content: `<h1>Modül #${i} İçeriği</h1><p>Bu eğitim modülü siber güvenlik profesyonelleri için hazırlanmıştır. İlgili konunun teknik detayları, senaryoları ve savunma stratejileri burada yer alır.</p>`
                });
            }
        }

        let completed = JSON.parse(localStorage.getItem('cyber_portal_v4_prog') || '[]');
        let currentId = null;

        function render(f = 'all') {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            const filtered = f === 'all' ? topics : topics.filter(t => t.cat === f);
            
            filtered.forEach(t => {
                const isDone = completed.includes(t.id);
                const card = document.createElement('div');
                card.className = `cyber-card p-6 rounded-2xl cursor-pointer animate-fade ${isDone ? 'border-emerald-500 opacity-80' : ''}`;
                card.onclick = () => openReader(t.id);
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-6">
                        <div class="w-12 h-12 rounded-xl bg-slate-950 flex items-center justify-center border border-slate-800">
                            <i class="fas ${t.icon} ${t.cat === 'cat-off' ? 'text-red-400' : (t.cat === 'cat-def' ? 'text-emerald-400' : 'text-sky-400')}"></i>
                        </div>
                        <span class="text-[10px] mono text-slate-600 font-bold">XP: +${t.xp}</span>
                    </div>
                    <h3 class="font-bold text-white mb-2 leading-tight h-12 line-clamp-2">${t.title}</h3>
                    <p class="text-xs text-slate-500 line-clamp-3 mb-6">${t.short}</p>
                    <div class="flex justify-between items-center pt-4 border-t border-slate-800/50">
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full ${isDone ? 'bg-emerald-500' : 'bg-slate-700 animate-pulse'}"></span>
                            <span class="text-[9px] font-black uppercase text-slate-500">${isDone ? 'TAMAMLANDI' : 'SIRADA'}</span>
                        </div>
                        <i class="fas fa-chevron-right text-[10px] text-slate-700"></i>
                    </div>
                `;
                grid.appendChild(card);
            });
            updateStats();
        }

        function openReader(id) {
            currentId = id;
            const t = topics.find(x => x.id === id);
            const modal = document.getElementById('reader-modal');
            const content = document.getElementById('modal-content');
            const btn = document.getElementById('done-btn');
            
            document.getElementById('modal-vol').innerText = `MODÜL #${id.toString().padStart(3,'0')}`;
            document.getElementById('modal-title').innerText = t.title;
            content.innerHTML = t.content;
            
            const isDone = completed.includes(id);
            btn.className = `px-6 py-2 rounded-lg text-xs font-black uppercase transition ${isDone ? 'bg-emerald-500 text-slate-950' : 'bg-sky-500 text-slate-950 hover:bg-sky-400'}`;
            btn.innerText = isDone ? 'Tamamlandı ✅' : 'Dersi Bitir';
            
            modal.classList.add('modal-active');
            document.body.style.overflow = 'hidden';
        }

        function closeReader() {
            document.getElementById('reader-modal').classList.remove('modal-active');
            document.body.style.overflow = 'auto';
        }

        function markDone() {
            if(!currentId) return;
            if(!completed.includes(currentId)) {
                completed.push(currentId);
                localStorage.setItem('cyber_portal_v4_prog', JSON.stringify(completed));
                render();
                openReader(currentId);
            }
        }

        function updateStats() {
            const perc = Math.round((completed.length / 210) * 100);
            const totalXp = completed.reduce((acc, curr) => acc + (topics.find(t => t.id === curr)?.xp || 0), 0);
            
            document.getElementById('main-progress').style.width = perc + '%';
            document.getElementById('perc-val').innerText = perc + '%';
            document.getElementById('count-done').innerText = completed.length;
            document.getElementById('xp-val').innerText = totalXp.toLocaleString();
        }

        function filter(c) {
            render(c);
        }

        function searchTopics() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            topics.filter(t => t.title.toLowerCase().includes(query) || t.short.toLowerCase().includes(query))
                  .forEach(t => {
                      // Kart oluşturma mantığı render ile aynı... (Pratik için direkt render çağrılabilir ama arama için filtreleme gerek)
                  });
            // Hızlı çözüm için filtreleme mantığını render içine gömebiliriz.
        }

        function handleTerminal(e) {
            if(e.key === 'Enter') {
                const input = e.target.value.toLowerCase();
                const output = document.getElementById('terminal-output');
                output.innerHTML += `\nroot@cyberportal:~# ${input}`;
                
                if(input.includes('nmap')) {
                    output.innerHTML += `\nStarting Nmap 7.92... \nScanning target...\nPORT     STATE SERVICE\n80/tcp   open  http\n443/tcp  open  https\nNmap done: 1 IP address (1 host up) scanned.`;
                } else if (input === 'ls') {
                    output.innerHTML += `\ncredentials.txt  exploit.py  notes.md  tools/`;
                } else if (input === 'help') {
                    output.innerHTML += `\nKullanılabilir komutlar: nmap, ls, clear, whoami, ping`;
                } else if (input === 'clear') {
                    output.innerHTML = '';
                } else {
                    output.innerHTML += `\nKomut bulunamadı: ${input}`;
                }
                
                e.target.value = '';
                const term = document.querySelector('.interactive-terminal');
                term.scrollTop = term.scrollHeight;
            }
        }

        window.onload = () => render();
    </script>
</body>
</html>
